ing:30px;border-radius:15px;width:min(480px,92vw);box-shadow:0 20px 100px #1e2c2433}.dialog p{color:#7a8370;line-height:1.8;font-size:13px}.dialog input{width:100%;margin:8px 0}.dialog h2{margin-bottom:15px}.dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}.cloud{background:#edf0e4;border-radius:9px;padding:18px;margin:18px 0}.mobileback{display:none}@media(min-width:1400px){.app{grid-template-columns:235px 360px 1fr}.paper{padding-top:65px}}@media(max-width:1050px){.app{grid-template-columns:170px 260px 1fr}.paper{padding:30px 25px}.sub{display:none}.actions{padding:12px}.actions button{padding:7px}}@media(max-width:750px){.app{grid-template-columns:150px 1fr}.workspace{display:none}.app.editing{display:block}.app.editing aside,.app.editing .list{display:none}.app.editing .workspace{display:flex;height:100%}.mobileback{display:inline-block}.status{display:none}header{padding:0 15px}.paper{padding:25px}.title{font-size:26px}}

.app{grid-template-columns:230px 335px 1fr}.sidebrand{padding:3px 12px 14px;font-size:10px;letter-spacing:1.7px;color:#6d7e60}.sidebrand span{display:block;font-size:13px;letter-spacing:0;margin-top:8px;color:#354c31}.folderlabel{align-items:center;margin-right:0;display:flex;justify-content:space-between}.folderlabel button{padding:3px 7px;font-size:15px}.folderlabel div{display:flex}#foldersort{font-size:11px;padding:6px;margin:0 7px 8px;color:#7c8871;border:0}aside{overflow:auto}.folderrow{display:flex;align-items:center;min-height:36px;border-radius:6px}.folderrow .fname{min-width:0;flex:1;text-align:left;padding:8px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.folderrow .fmore{font-size:12px;opacity:.55;padding:5px}.folderrow .fold{padding:5px 2px;width:17px;font-size:10px}.folderrow.dragover{outline:1px dashed #819b70;background:#e5ebdd}.foldericon{margin-right:7px}.foldercount{font-size:10px;color:#9ba38f;margin:0 4px}.listhead{margin-bottom:16px}.listhead h2{margin-top:7px}.createbar{display:grid;grid-template-columns:1fr 1.2fr .9fr;gap:5px;margin-bottom:16px}.createbar button{background:#e9eee2;color:#41583f;font-size:12px;padding:10px 4px;border:1px solid #dce4d3}.createbar button:first-child{background:#41583f;color:white;border-color:#41583f}.typefilters{display:flex;gap:2px;margin-bottom:15px;justify-content:space-between}.typefilters button{font-size:11px;padding:6px 8px;color:#8b9480}.typefilters button.active{color:#3f5538}.note{border-left:3px solid var(--typecolor,#a5b49a)}.note.selected{background:var(--typebg,#eff3e8);border-color:var(--typecolor,#a5b49a)}.typebadge{display:inline-flex;gap:4px;color:var(--typecolor);font-size:10px;font-weight:600}.toolbar{flex-wrap:wrap;align-items:center;gap:2px}.toolbar select{font-size:11px;border:0;padding:7px;background:#f1f2ea;max-width:125px}.toolbar button{font-size:12px;min-width:28px}.toolsep{height:18px;width:1px;background:#dfe3d6;margin:0 5px}.colorlabel{position:relative;font-weight:700;padding:6px 9px;border-bottom:3px solid #617a52;cursor:pointer}.colorlabel input{position:absolute;opacity:0;width:100%;height:100%;left:0;top:0;padding:0;cursor:pointer}.editor h1{font-size:32px;line-height:1.4;margin:24px 0 12px}.editor h2{font-size:26px;line-height:1.5}.editor h3{font-size:22px;line-height:1.5}.editor h4{font-size:18px;line-height:1.5}.editor h5{font-size:16px;line-height:1.5}.editor p{margin:8px 0}.details{flex-wrap:wrap}.details select{max-width:180px}.paper{border-top:3px solid var(--typecolor,#9bab8d);margin-top:0}.folderform label{display:block;font-size:11px;color:#7d8a71;margin-top:12px}.folderform select{width:100%}.managerrow{display:flex;align-items:center;gap:5px;padding:8px 0;border-bottom:1px solid #e6e9de}.managerrow span{flex:1;overflow-wrap:anywhere}.managerrow button{padding:5px 8px}.dialog{max-height:85dvh;overflow:auto}.editor [data-level="2"]{margin-left:24px}.editor [data-level="3"]{margin-left:48px}.editor [data-level="4"]{margin-left:72px}.editor [data-level="5"]{margin-left:96px}@media(min-width:1500px){.app{grid-template-columns:245px 365px 1fr}}@media(max-width:1100px){.app{grid-template-columns:200px 290px 1fr}.paper{padding:28px}.actions{padding:12px}.actions button{padding:7px}}@media(max-width:750px){.app{grid-template-columns:145px 1fr}.app.editing{display:block}aside{padding:20px 8px}.fmore{padding:3px!important}.paper{padding:24px}.createbar button{font-size:11px}.typefilters button{padding:5px}.toolbar{gap:4px}.foldercount{display:none}}
</style><header><div class="logo"><i>◩</i>MEMOA</div><span class="sub">생각이 머무는 곳</span><span class="grow"></span><span class="status" id="saveState">● 이 브라우저에 자동 저장</span><button onclick="settings()">☁ 동기화 설정</button><span style="border-radius:50%;background:#e5e9db;padding:9px;font-size:11px">나</span></header><main class="app" id="app"><aside><div class="sidebrand">MY SPACE <span>개인 작업실</span></div><div class="label">WORKSPACE</div><button class="nav" data-view="all" onclick="setView('all')">▤ 모든 메모 <span id="total"></span></button><button class="nav" data-view="pinned" onclick="setView('pinned')">⌑ 고정한 메모</button><div class="label folderlabel">폴더 <div><button onclick="folderManager()" title="폴더 정렬 및 관리" aria-label="폴더 관리">↕</button><button onclick="addFolder()" title="폴더 추가" aria-label="폴더 추가">＋</button></div></div><select id="foldersort" aria-label="폴더 정렬" onchange="db.folderSort=this.value;persist();renderSide()"><option value="manual">폴더 수동 정렬</option><option value="asc">폴더 이름 오름차순</option><option value="desc">폴더 이름 내림차순</option></select><div id="folders"></div><div class="label">태그</div><div id="taglist" style="padding:0 10px;line-height:2"></div><div class="sidebottom"><button class="nav" data-view="trash" onclick="setView('trash')">♲ 휴지통</button><div class="sub" style="display:block;padding:10px 12px">PROTOTYPE · 08<br>기기 저장 · 동기화 설정</div></div></aside><section class="list"><div class="listhead"><div><div class="eyebrow">YOUR COLLECTION</div><h2 id="viewtitle">모든 메모</h2></div></div><div class="createbar"><button onclick="newNote({type:'note'})">＋ 메모</button><button onclick="newNote({type:'idea'})">✧ 아이디어</button><button onclick="linkDialog()">↗ 링크</button></div><div class="typefilters"><button data-filter="all" onclick="filterType('all')">전체</button><button data-filter="note" onclick="filterType('note')">메모</button><button data-filter="idea" onclick="filterType('idea')">아이디어</button><button data-filter="ref" onclick="filterType('ref')">링크</button><button data-filter="task" onclick="filterType('task')">할 일</button></div><input class="search" placeholder="⌕ 메모와 태그 검색" id="search" oninput="renderList()"><div class="sortrow"><span id="count"></span><select id="sort" onchange="setSort(this.value)"><option value="manual">수동 정렬 ↕</option><option value="modified">최근 수정순</option><option value="title">제목 오름차순</option><option value="titleDesc">제목 내림차순</option><option value="created">최근 생성순</option></select></div><div id="notes"></div><p class="sub" style="display:block;text-align:center;margin-top:25px">수동 정렬에서는 드래그로 순서 변경</p></section><section class="workspace"><div class="actions"><button class="mobileback" onclick="document.getElementById('app').classList.remove('editing')">← 목록</button><span class="crumb" id="crumb">나의 메모</span><button onclick="togglePin()" id="pin">⌑ 고정</button><button onclick="copyText()">복사</button><button onclick="exportTxt()">TXT ↓</button><button onclick="removeNote()" id="del">휴지통</button></div><div class="paper" id="paper"><div class="eyebrow">A LITTLE SPACE FOR YOUR IDEAS</div><input id="title" class="title" placeholder="제목 없는 메모" oninput="update()"><div class="details"><span id="date"></span><span>·</span><select id="notetype" aria-label="메모 유형" onchange="changeType(this.value)"><option value="note">▤ 일반 메모</option><option value="idea">✧ 아이디어</option><option value="ref">↗ 링크</option><option value="task">☑ 할 일</option></select><select id="folderselect" onchange="update()"></select></div><div class="toolbar" id="toolbar"><select id="blockstyle" aria-label="텍스트 크기" onchange="applyBlock(this.value)"><option value="p">본문</option><option value="h1">H1 · 큰 제목</option><option value="h2">H2 · 제목</option><option value="h3">H3 · 소제목</option><option value="h4">H4 · 작은 제목</option><option value="h5">H5 · 세부 제목</option></select><button onclick="fmt('bold')" title="굵게"><b>B</b></button><button onclick="fmt('italic')" title="기울임"><i>I</i></button><label class="colorlabel" title="글자색">A<input type="color" id="textcolor" aria-label="글자색" value="#505948" onchange="applyColor(this.value)"></label><span class="toolsep"></span><button onclick="fmt('insertUnorderedList')" title="글머리 목록">☷</button><button onclick="fmt('insertOrderedList')" title="번호 목록">1.</button><button onclick="insertCheck()" title="체크 항목">☑</button><select id="levelselect" aria-label="들여쓰기 레벨" onchange="applyLevel(Number(this.value))"><option value="1">레벨 1</option><option value="2">레벨 2</option><option value="3">레벨 3</option><option value="4">레벨 4</option><option value="5">레벨 5</option></select><button onclick="shiftLevel(-1)" title="내어쓰기">⇤</button><button onclick="shiftLevel(1)" title="들여쓰기">⇥</button><span class="toolsep"></span><button onclick="insertLink()" title="링크 삽입">↗</button><button onclick="document.getElementById('image').click()">▧ 이미지</button><button onclick="plainPaste()" title="일반 텍스트 입력">T</button><input type="file" id="image" accept="image/*" hidden onchange="imageUpload(this.files)"></div><div id="editor" class="editor" contenteditable="true" oninput="update()"></div><input class="tagsinput" id="tags" placeholder="#태그 입력 · 쉼표로 구분" onchange="update()"></div><div class="footer"><span id="words"></span><span>서두르지 않아도, 생각은 여기에.</span></div></section></main><div class="toast" id="toast"></div><div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="dialog" id="dialog"></div></div>
<script src="foundation-core.js"></script><script src="persistence.js"></script><script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db;try{db=JSON.parse(localStorage.getItem('moa-v1'))}catch{}if(!db)db={folders:['아이디어','작업 노트','일상','수집함'],sorts:{},notes:[{id:'welcome',title:'흩어진 생각을, 한곳에',folder:'아이디어',html:'<p>문득 떠오른 생각, 다시 보고 싶은 문장,<br>언젠가 꺼내 볼 작은 아이디어까지.</p><h2>나만의 속도로 기록하세요.</h2><p>저장 버튼은 필요 없어요. 쓰는 동안 이 브라우저에 자동으로 남습니다.</p><ul><li>폴더와 메모를 드래그해서 원하는 순서로 정리</li><li>웹이나 유튜브 링크는 ↗ 버튼으로 수집</li><li>이미지는 복사해서 붙여넣거나 파일로 추가</li><li>필요한 메모는 TXT로 꺼내기</li></ul><p><b>가볍게 쓰고, 오래 간직하기.</b><br>MEMOA의 첫 페이지를 함께 채워보세요.</p>',tags:['시작하기','메모'],pin:true,created:Date.now(),modified:Date.now()},{id:'story',title:'다음 이야기의 시작',folder:'작업 노트',html:'<h2>작은 질문에서 출발하기</h2><p>주인공이 가장 지키고 싶은 것은 무엇일까?<br>그것을 지키기 위해 무엇을 포기할 수 있을까?</p><p>오늘은 결론보다 질문을 모아두자.</p>',tags:['스토리','아이디어'],created:Date.now()-10000,modified:Date.now()-10000},{id:'ref',title:'영상 레퍼런스 모음',folder:'수집함',html:'<p>연출과 움직임을 관찰할 때 참고할 영상들을 모읍니다.</p><p><a href="https://www.youtube.com/" target="_blank" rel="noopener">YouTube — 영상 찾아보기 ↗</a></p><p>링크를 추가할 때 기억하고 싶은 이유도 한 줄 남겨보세요.</p>',tags:['영상','레퍼런스'],ref:true,created:Date.now()-20000,modified:Date.now()-20000}]};let current=db.notes[0]?.id,view='all',tag='',drag=null;function persist(){if(window.MEMOAStore){MEMOAStore.queue(db);return}try{localStorage.setItem('moa-v1',JSON.stringify(db));$('saveState').textContent='● 이 브라우저에 저장됨'}catch{toast('저장하지 못했습니다. 백업으로 내보내주세요.')}}function note(){return db.notes.find(n=>n.id===current)}function textOf(html){let d=document.createElement('div');d.innerHTML=html;return d.innerText||d.textContent||''}function filtered(){let q=$('search').value.toLowerCase();let ns=db.notes.filter(n=>(view==='trash'?n.deleted:!n.deleted)&&(view==='all'||view==='trash'||view==='pinned'&&n.pin||view==='refs'&&n.ref||view.startsWith('folder:')&&n.folder===view.slice(7)||view==='tag'&&n.tags.includes(tag))&&[n.title,textOf(n.html),...n.tags].join(' ').toLowerCase().includes(q));let sort=db.sorts[view]||'manual';if(sort==='modified'||sort==='created')ns.sort((a,b)=>b[sort]-a[sort]);if(sort.startsWith('title'))ns.sort((a,b)=>a.title.localeCompare(b.title,'ko')*(sort==='titleDesc'?-1:1));return ns}function renderSide(){$('total').textContent=db.notes.filter(n=>!n.deleted).length;$('folders').innerHTML=db.folders.map(f=>`<button draggable="true" class="nav ${view==='folder:'+f?'active':''}" style="width:100%" data-folder="${esc(f)}">▱ ${esc(f)} <span>${db.notes.filter(n=>!n.deleted&&n.folder===f).length}</span></button>`).join('');document.querySelectorAll('[data-folder]').forEach(el=>{el.onclick=()=>setView('folder:'+el.dataset.folder);el.ondragstart=e=>{drag={folder:el.dataset.folder};e.dataTransfer.setData('text/plain','folder')};el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();if(drag?.folder){let a=db.folders.indexOf(drag.folder),b=db.folders.indexOf(el.dataset.folder);db.folders.splice(b,0,...db.folders.splice(a,1));persist();renderSide()}}});$('taglist').innerHTML=[...new Set(db.notes.filter(n=>!n.deleted).flatMap(n=>n.tags))].map(t=>`<button class="chip" data-tag="${esc(t)}">#${esc(t)}</button>`).join('');document.querySelectorAll('[data-tag]').forEach(el=>el.onclick=()=>{tag=el.dataset.tag;setView('tag')});document.querySelectorAll('[data-view]').forEach(el=>el.classList.toggle('active',view===el.dataset.view))}function renderList(){let ns=filtered();$('count').textContent=ns.length+'개의 메모';$('notes').innerHTML=ns.map(n=>`<article draggable="true" data-id="${n.id}" class="note ${n.id===current?'selected':''}"><div class="meta"><span>${esc(n.folder)} ${n.ref?'↗':''}</span><span>${n.pin?'⌑':''} ${new Date(n.modified).toLocaleDateString('ko',{month:'short',day:'numeric'})}</span></div><h3>${esc(n.title||'제목 없는 메모')}</h3><p>${esc(textOf(n.html))}</p>${n.tags.slice(0,3).map(t=>`<span class="chip">#${esc(t)}</span>`).join('')}</article>`).join('')||'<div class="empty">아직 메모가 없어요.<br>새로운 생각을 남겨보세요.</div>';document.querySelectorAll('[data-id]').forEach(el=>{el.onclick=()=>{current=el.dataset.id;renderEditor();renderList();$('app').classList.add('editing')};el.ondragstart=e=>{drag={id:el.dataset.id};e.dataTransfer.setData('text/plain',el.dataset.id)};el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();if(drag?.id&&(db.sorts[view]||'manual')==='manual'){let a=db.notes.findIndex(n=>n.id===drag.id),b=db.notes.findIndex(n=>n.id===el.dataset.id);db.notes.splice(b,0,...db.notes.splice(a,1));persist();renderList()}}})}function renderEditor(){let n=note();$('paper').style.display=n?'block':'none';if(!n)return;$('title').value=n.title;$('editor').innerHTML=n.html;$('tags').value=n.tags.map(t=>'#'+t).join(', ');$('folderselect').innerHTML=db.folders.map(f=>`<option ${n.folder===f?'selected':''}>${esc(f)}</option>`).join('');$('date').textContent=new Date(n.created).toLocaleDateString('ko');$('crumb').textContent='나의 메모 / '+n.folder;$('pin').textContent=n.pin?'⌑ 고정됨':'⌑ 고정';$('del').textContent=n.deleted?'복원':'휴지통';wordCount()}function wordCount(){$('words').textContent=(note()?textOf(note().html).length:0)+'자 · 자동 저장'}function update(){let n=note();if(!n)return;n.title=$('title').value;n.html=$('editor').innerHTML;n.folder=$('folderselect').value;n.tags=$('tags').value.split(/[,#]/).map(t=>t.trim()).filter(Boolean);n.modified=Date.now();persist();renderList();renderSide();wordCount()}function setView(v){view=v;$('viewtitle').textContent=v.startsWith('folder:')?v.slice(7):({all:'모든 메모',pinned:'고정한 메모',refs:'레퍼런스',trash:'휴지통',tag:'#'+tag}[v]);$('sort').value=db.sorts[v]||'manual';let ns=filtered();if(!ns.some(n=>n.id===current))current=ns[0]?.id;renderSide();renderList();renderEditor()}function setSort(v){db.sorts[view]=v;persist();renderList()}function newNote(data={}){let n={id:crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2),title:'',html:'',tags:[],folder:view.startsWith('folder:')?view.slice(7):db.folders[0],created:Date.now(),modified:Date.now(),...data};db.notes.unshift(n);current=n.id;if(view==='trash'||view==='pinned'||view==='tag')view='all';persist();setView(view);$('app').classList.add('editing');$('title').focus()}function addFolder(){let f=prompt('새 폴더 이름');if(f?.trim()&&!db.folders.includes(f.trim())){db.folders.push(f.trim());persist();renderSide();renderEditor()}}function togglePin(){let n=note();if(n){n.pin=!n.pin;persist();renderSide();renderList();renderEditor()}}function removeNote(){let n=note();if(n){n.deleted=!n.deleted;persist();setView(view)}}function fmt(cmd,value){$('editor').focus();document.execCommand(cmd,false,value);update()}function insertCheck(){fmt('insertHTML','<p>☐ 할 일</p>')}function insertLink(){let url=prompt('링크 주소 (https://...)');if(url){try{let u=new URL(url);if(!['https:','http:'].includes(u.protocol))throw 0;fmt('insertHTML',`<a href="${esc(u.href)}" target="_blank" rel="noopener">${esc(u.href)}</a>`)}catch{toast('올바른 웹 주소를 입력해주세요.')}}}function plainPaste(){let t=prompt('일반 텍스트를 붙여넣으세요');if(t!==null)fmt('insertText',t)}async function copyText(){if(!note())return;try{await navigator.clipboard.writeText(note().title+'\n\n'+exportBody());toast('텍스트를 복사했습니다.')}catch{toast('본문을 선택하고 Ctrl/Cmd+C로 복사해주세요.')}}function exportBody(){let d=document.createElement('div');d.innerHTML=note().html;d.querySelectorAll('a').forEach(a=>a.textContent=a.textContent+' ('+a.href+')');return d.innerText}function exportTxt(){if(!note())return;let url=URL.createObjectURL(new Blob([note().title+'\n\n'+exportBody()],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=(note().title||'메모').replace(/[\\/:*?"<>|]/g,'_')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function imageUpload(files){for(let f of files){if(!f.type.startsWith('image/'))continue;if(f.size>3*1024*1024){toast('프로토타입에서는 3MB 이하 이미지를 사용해주세요.');continue}let r=new FileReader;r.onload=()=>{fmt('insertHTML',`<p><img alt="${esc(f.name||'붙여넣은 이미지')}" src="${r.result}"></p>`)};r.readAsDataURL(f)}$('image').value=''}$('editor').addEventListener('paste',e=>{let images=[...e.clipboardData.items].filter(i=>i.type.startsWith('image/'));if(images.length){e.preventDefault();imageUpload(images.map(i=>i.getAsFile()));return}e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'));update()});$('editor').addEventListener('dragover',e=>e.preventDefault());$('editor').addEventListener('drop',e=>{e.preventDefault();imageUpload(e.dataTransfer.files)});function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3200)}function modal(html){$('dialog').innerHTML=html;$('modal').style.display='flex'}function closeModal(){$('modal').style.display='none'}function settings(){modal('<div class="eyebrow">STORAGE & SYNC</div><h2>어디서든, 나의 메모</h2><div class="cloud"><b>△ Google Drive</b><p>우선 지원할 동기화 서비스</p><span class="chip">미연결 · 설정 미리보기</span></div><p>현재는 이 브라우저에만 자동 저장됩니다. 다른 기기와의 동기화 및 실제 구글 계정 연결은 아직 구현되지 않았습니다.</p><p>정식 버전에서는 클라우드 하나만 연결하며, 오프라인 작성 후 연결 시 동기화합니다.</p><div class="row"><button class="primary" onclick="closeModal()">확인</button></div>')}function linkDialog(){modal('<div class="eyebrow">REFERENCE COLLECTION</div><h2>다시 보고 싶은 링크</h2><input id="linkurl" placeholder="https:// 웹 또는 유튜브 주소"><input id="linktitle" placeholder="제목"><input id="linktags" placeholder="태그 · 예: 영상, 연출"><input id="linkmemo" placeholder="기억하고 싶은 이유 한 줄"><p>제목과 태그로 모아두고, 나중에 쉽게 찾아보세요.</p><div class="row"><button onclick="closeModal()">취소</button><button class="primary" onclick="saveLink()">수집함에 저장</button></div>')}
